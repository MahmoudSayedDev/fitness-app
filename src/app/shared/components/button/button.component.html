<button
  [type]="type()"
  [disabled]="isInactive()"
  [attr.aria-busy]="isLoading()"
  class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-[20px] bg-[#FF4100] px-4 py-2.5 text-base font-bold text-white transition hover:bg-[#e63a00] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#FF4100] active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-60 disabled:bg-[#D3D3D3]! {{ styleClass() }}"
  (click)="handleClick()"
>
  @if (isLoading()) {
    <svg lucideLoaderCircle class="size-5 animate-spin" strokeWidth="2"></svg>
  }
  
  <ng-content />
</button>
