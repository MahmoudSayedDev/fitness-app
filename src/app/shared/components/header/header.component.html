<header class="absolute w-full py-4 {{styleClass()}}">
    <div class="container mx-auto grid grid-cols-12 items-center gap-5">
        <div class="col-span-1">
            <img class="w-full" src="assets/imgs/logo.png">
        </div>

        <div class="col-span-8 px-7 text-center h-full">
            <ul class="grid grid-cols-8 mx-auto items-center h-full">
                <li class="col-start-3 h-full flex justify-center items-center">
                    <a [routerLink]="['/home']" routerLinkActive="text-primary" class="capitalize font-medium hover:text-primary transition px-5 py-3">home</a>
                </li>
                <li class="h-full flex justify-center items-center">
                    <a [routerLink]="['/about']" routerLinkActive="" class="capitalize font-medium hover:text-primary transition px-5 py-3">about</a>
                </li>
                <li class="h-full flex justify-center items-center">
                    <a [routerLink]="['/classes']" routerLinkActive="" class="capitalize font-medium hover:text-primary transition px-5 py-3">classes</a>
                </li>
                <li class="h-full flex justify-center items-center">
                    <a [routerLink]="['/healthy']" routerLinkActive="" class="capitalize font-medium hover:text-primary transition px-5 py-3">healthy</a>
                </li>
            </ul>
        </div>

        <div class="col-span-3 flex  items-center justify-end gap-7">
            @if (isAuthenticated()) {
                <a [routerLink]="['/account-settings']" class="bg-primary text-white rounded-full p-1.5">
                    <svg lucideUser  ></svg>
                </a>
            } @else {
                <app-button styleClass="px-7" type="submit" [withArrow]="true">login</app-button>
                <app-button styleClass="px-7" type="submit" [outline]="true" [withArrow]="true">sign up</app-button>
            }

        </div>
    </div>
</header>
