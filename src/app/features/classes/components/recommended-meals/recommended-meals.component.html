<div class="carousel-wrapper">
  <swiper-container init="false" [appSwiper]="workoutsConfig()">
    @for (meal of meals(); track meal.idMeal) {
      <swiper-slide>
        <app-card-item
          [id]="meal.idMeal"
          [title]="meal.strMeal"
          [imageUrl]="meal.strMealThumb"
          height="h-87.5"
        ></app-card-item>
      </swiper-slide>
    }
  </swiper-container>
</div>
