<div class="w-full">
  @if (classesFacade.loadWorkoutsLoading()) {
    <div class="loading">Loading...</div>
  } @else {
    <div class="carousel-wrapper">
      <swiper-container
        init="false"
        [appSwiper]="workoutsConfig()"
        (swiperinit)="syncSwiperState($event)"
        (swiperbreakpoint)="syncSwiperState($event)"
        (swiperslidechange)="syncSwiperState($event)"
      >
        @for (workout of classesFacade.workouts(); track workout._id) {
          <swiper-slide>
            <!-- <app-muscle-card
              [imageUrl]="workout.image"
              [title]="workout.title"
              (explore)="onExplore(workout)"
            ></app-muscle-card> -->
          </swiper-slide>
        }
      </swiper-container>
    </div>

    @if (pageCount() > 1) {
      <div class="carousel-dots">
        @for (i of dots(); track i) {
          <span class="dot" [class.active]="i === activePage()"></span>
        }
      </div>
    }
  }
</div>
