<div class="step-container">
  <app-step-header
    [title]="'What Is Your Weight?'"
    [subtitle]="'You can always change this later'"
    [currentStep]="3"
    [totalSteps]="6"
  />
  <app-wheel-selector
    [min]="30"
    [max]="200"
    unit="kg"
    [initialValue]="selectedWeight()"
    (valueChange)="selectedWeight.set($event)"
  />
  <app-button type="button" (onClick)="onNext()" [isDisabled]="!isValid()">
    Next
  </app-button>
</div>
