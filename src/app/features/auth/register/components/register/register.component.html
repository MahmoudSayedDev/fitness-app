<div class="register-wrapper">
  <app-step-header
    [title]="stepConfig().title"
    [subtitle]="stepConfig().subtitle"
    [currentStep]="currentStep() - 1"
    [totalSteps]="6"
    [class.hidden]="currentStep() === 1"
  />

  <div class="step-content" [@stepTransition]="currentStep()">
    @if (currentStep() === 1) {
      <app-register-account
        (next)="onAccountNext($event)"
        [serverError]="registerError()"
      />
    }
    @if (currentStep() === 2) {
      <app-register-gender (next)="onGenderNext($event)" class="w-full"/>
    }
    @if (currentStep() === 3) {
      <app-register-age (next)="onAgeNext($event)" class="w-full"/>
    }
    @if (currentStep() === 4) {
      <app-register-weight (next)="onWeightNext($event)" class="w-full"/>
    }
    @if (currentStep() === 5) {
      <app-register-height (next)="onHeightNext($event)" class="w-full"/>
    }
    @if (currentStep() === 6) {
      <app-register-goal (next)="onGoalNext($event)" class="w-full"/>
    }
    @if (currentStep() === 7) {
      <app-register-activity (next)="onActivitySubmit($event)" class="w-full"/>
    }
  </div>
</div>
