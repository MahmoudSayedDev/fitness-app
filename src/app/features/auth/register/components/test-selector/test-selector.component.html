<span class=" capitalize text-center block text-primary mb-4">year</span>
<swiper-container
    [slidesPerView]="4"
    [space-between]="5"
    [centeredSlides]="true"
    effect='coverflow'
    [coverflowEffect]='{
        rotate: 0,
        stretch: 0,
        depth: 300,
        modifier: 1,
        slideShadows: false,
    }'
    /* [breakpoints]="{
        '768': {
            slidesPerView: 3,
        },
    }" */
    (swiperslidechange)="onSlideChange($any($event))"
>
    @for (age of ageOptions; track age) {
        <swiper-slide class="text-white text-center text-3xl font-bold" [val]="age">{{age}}</swiper-slide>
    }
</swiper-container>
<span class="arrowUp text-center block text-primary my-4"></span>
