<section class="space-y-2">
  <app-auth-title title="Create An Account"></app-auth-title>
  <section class="rounded-[50px] border border-[#D3D3D3] p-10 space-y-2 mt-4">
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
      <div class="space-y-4">
        <p class="text-2xl font-extrabold text-white text-center">Register</p>
        <div class="space-y-2">
          <div class="space-y-4">
            <div>
              <app-input
                inputId="first_name"
                formControlName="firstName"
                placeholder="First Name"
                [attr.aria-describedby]="firstNameError.id()"
                [attr.aria-invalid]="
                  form.controls['firstName'].invalid && form.controls['firstName'].touched
                "
              >
                <svg #inputIcon lucideUser class="size-5"></svg>
              </app-input>
              <app-field-error
                #firstNameError
                [control]="form.controls['firstName']"
                label="First name"
              ></app-field-error>
            </div>
            <div>
              <app-input
                inputId="last-name"
                formControlName="lastName"
                placeholder="Last Name"
                [attr.aria-describedby]="lastNameError.id()"
                [attr.aria-invalid]="
                  form.controls['lastName'].invalid && form.controls['lastName'].touched
                "
              >
                <svg #inputIcon lucideUser class="size-5"></svg>
              </app-input>
              <app-field-error
                #lastNameError
                [control]="form.controls['lastName']"
                label="Last name"
              ></app-field-error>
            </div>
            <div>
              <app-input
                inputId="email"
                typ="email"
                formControlName="email"
                placeholder="Email"
                [attr.aria-describedby]="emailError.id()"
                [attr.aria-invalid]="
                  form.controls['email'].invalid && form.controls['email'].touched
                "
              >
                <svg #inputIcon lucideMail class="size-5"></svg>
              </app-input>
              <app-field-error
                #emailError
                [control]="form.controls['email']"
                label="Email"
              ></app-field-error>
            </div>
            <div>
              <app-input
                inputId="password"
                type="password"
                formControlName="password"
                placeholder="Password"
                [attr.aria-describedby]="passwordError.id()"
                [attr.aria-invalid]="
                  form.controls['password'].invalid && form.controls['password'].touched
                "
              >
                <svg #inputIcon lucideLock class="size-5"></svg>
              </app-input>
              <app-field-error
                #passwordError
                [control]="form.controls['password']"
                label="Password"
                [customMessages]="{
                  pattern: 'Please enter a valid password',
                }"
              ></app-field-error>
            </div>
            <div>
              <app-input
                inputId="rePassword"
                type="password"
                formControlName="rePassword"
                placeholder="Confirm Password"
                [attr.aria-describedby]="rePasswordError.id()"
                [attr.aria-invalid]="
                  form.controls['rePassword'].invalid && form.controls['rePassword'].touched
                "
              >
                <svg #inputIcon lucideLock class="size-5"></svg>
              </app-input>
              <app-field-error
                #rePasswordError
                [control]="form.controls['rePassword']"
                label="Confirm password"
                [customMessages]="{
                  mustMatch: 'Passwords do not match.',
                }"
              ></app-field-error>
            </div>
          </div>
          <div class="text-end">
            <a href="" class="font-bold underline text-primary">Forget Password ?</a>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-center gap-5">
        <div class="w-20 border border-[#D3D3D3]"></div>
        <span class="text-sm text-[#D3D3D3]">Or</span>
        <div class="w-20 border border-[#D3D3D3]"></div>
      </div>
      <div class="flex items-center gap-4 justify-center">
        <button
          class="cursor-pointer w-8 h-8 rounded-full bg-[#242424] text-[#FDFDFD] flex items-center justify-center"
        >
          <svg
            width="9"
            height="16"
            viewBox="0 0 9 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5.84176 16V8.701H8.49528L8.89318 5.85643H5.84176V4.04026C5.84176 3.21675 6.08953 2.6555 7.36862 2.6555H9V0.112045C8.21036 0.0349106 7.41675 -0.00245621 6.62271 0.000125103C4.27052 0.000125103 2.66026 1.32569 2.66026 3.7602V5.85643H0V8.701H2.66026V16H5.84176Z"
              fill="#FDFDFD"
            />
          </svg>
        </button>
        <button

              />
              <path
                d="M3.43574 9.54936C3.26755 9.0533 3.17021 8.52176 3.17021 7.97257C3.17021 7.42332 3.26755 6.89184 3.42689 6.39577L3.42244 6.29013L0.932277 4.35498L0.850803 4.39376C0.31082 5.47449 0.000976562 6.68811 0.000976562 7.97257C0.000976562 9.25703 0.31082 10.4706 0.850803 11.5513L3.43574 9.54936Z"

              />
            </g>

              <clipPath id="clip0_108_181">

            </defs>
          </svg>
        </button>
        <button
          class="cursor-pointer w-8 h-8 rounded-full bg-[#242424] text-[#FDFDFD] flex items-center justify-center"
        >
          <svg
            width="13"

            viewBox="0 0 13 16"

          >
            <path
              d="M8.84861 2.55183C9.15042 2.20328 9.38055 1.79842 9.52577 1.3605C9.671 0.922581 9.72846 0.460232 9.69486 0C8.76828 0.0749446 7.90816 0.511611 7.29982 1.21592C7.00851 1.55348 6.78775 1.94617 6.65062 2.37076C6.51349 2.79534 6.46277 3.24318 6.50148 3.68776C6.95346 3.69153 7.40024 3.59104 7.80725 3.39406C8.21426 3.19708 8.57057 2.90891 8.84861 2.55183ZM10.8604 8.50344C10.8658 7.89047 11.0269 7.28897 11.3286 6.75571C11.6304 6.22246 12.0627 5.77502 12.5849 5.45564C12.2553 4.97986 11.8197 4.58756 11.3125 4.30985C10.8053 4.03214 10.2405 3.87666 9.66292 3.85574C8.41751 3.72775 7.26789 4.5837 6.60527 4.5837C5.94264 4.5837 5.00858 3.87174 3.97073 3.88774C3.29224 3.91014 2.63113 4.10835 2.05187 4.46305C1.47261 4.81775 0.99499 5.31683 0.665588 5.91161C-0.739498 8.35944 0.306333 11.9992 1.71142 13.9751C2.35009 14.943 3.14844 16.0389 4.20225 15.9989C5.25606 15.9589 5.59935 15.343 6.82082 15.343C8.04228 15.343 8.41751 15.9989 9.45535 15.9749C10.4932 15.9509 11.2277 14.983 11.8983 14.0151C12.3733 13.3123 12.7444 12.5444 13 11.7352C12.3673 11.4649 11.8275 11.0147 11.4473 10.4404C11.067 9.86602 10.863 9.19265 10.8604 8.50344Z"
              fill="white"
            />
          </svg>
        </button>
      </div>
      <app-button type="submit" [isDisabled]="form.invalid">Next</app-button>
    </form>
    @if (serverError()) {
      <div class="server-error">
        {{ serverError() }}
      </div>
    }
    <app-auth-switcher
      text="Already Have an account ?"
      linkLabel="Login"
      linkRef="/auth/login"
    ></app-auth-switcher>
  </section>
</section>
