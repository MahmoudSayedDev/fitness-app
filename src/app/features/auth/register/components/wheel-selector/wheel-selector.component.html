<div class="wheel-selector">
  @if (unit()) {
    <span class="wheel-unit">{{ unit() }}</span>
  }
  
  <swiper-container
    [slidesPerView]="4"
    [spaceBetween]="5"
    [centeredSlides]="true"
    effect="coverflow"
    [coverflowEffect]="{
      rotate: 0,
      stretch: 0,
      depth: 300,
      modifier: 1,
      slideShadows: false
    }"
    [initialSlide]="initialIndex()"
    (swiperslidechange)="onSlideChange($any($event))"
    style="width: 100%; max-width: 320px;"
  >
    @for (val of options(); track val) {
      <swiper-slide>
        <span class="slide-value">
          {{ val }}
        </span>
      </swiper-slide>
    }
  </swiper-container>

  <span class="arrowUp"></span>
</div>
