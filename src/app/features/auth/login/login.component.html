<section class="space-y-2">
  <app-auth-title title="WELCOME BACK"></app-auth-title>
  <section class="rounded-[50px] border border-[#D3D3D3] p-10 backdrop-blur-3xl">
    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="mx-auto max-w-[350px] space-y-6" novalidate>
      <p class="text-center text-2xl font-extrabold text-white">Login</p>

      <div class="space-y-4">
        <div>
          <app-input
            inputId="email"
            type="email"
            formControlName="email"
            placeholder="Email"
            [attr.aria-describedby]="emailError.id()"
            [attr.aria-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
          >
            <svg #inputIcon lucideMail class="size-5" strokeWidth="1.5"></svg>
          </app-input>
          <app-field-error
            #emailError
            [control]="loginForm.controls.email"
            label="Email"
          ></app-field-error>
        </div>

        <div>
          <app-input
            inputId="password"
            type="password"
            formControlName="password"
            placeholder="Password"
            [attr.aria-describedby]="passwordError.id()"
            [attr.aria-invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
          >
            <svg #inputIcon lucideLock class="size-5" strokeWidth="1.5"></svg>
          </app-input>
          <app-field-error
            #passwordError
            [control]="loginForm.controls.password"
            label="Password"
          ></app-field-error>
        </div>

        <div class="flex justify-end">
          <a
            routerLink="/auth/forgot-password"
            class="text-base font-bold text-[#FF4100] underline underline-offset-2 hover:opacity-90"
          >
            Forget Password ?
          </a>
        </div>
      </div>

      <div class="flex items-center justify-center gap-6 text-sm text-[#D3D3D3]">
        <span class="h-px w-[90px] bg-[#D3D3D3]"></span>
        <span>Or</span>
        <span class="h-px w-[90px] bg-[#D3D3D3]"></span>
      </div>

      <div class="flex items-center justify-center gap-4">
        <button
          type="button"
          aria-label="Continue with Facebook"
          class="flex size-9 cursor-pointer items-center justify-center rounded-full bg-[#242424] text-white transition hover:bg-[#333]"
        >
          <svg viewBox="0 0 24 24" class="size-5" fill="currentColor" aria-hidden="true">
            <path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z" />
          </svg>
        </button>
        <button
          type="button"
          aria-label="Continue with Google"
          class="flex size-9 cursor-pointer items-center justify-center rounded-full bg-[#242424] text-white transition hover:bg-[#333]"
        >
          <svg viewBox="0 0 24 24" class="size-4.5" fill="currentColor" aria-hidden="true">
            <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" />
          </svg>
        </button>
        <button
          type="button"
          aria-label="Continue with Apple"
          class="flex size-9 cursor-pointer items-center justify-center rounded-full bg-[#242424] text-white transition hover:bg-[#333]"
        >
          <svg viewBox="0 0 24 24" class="size-4.5" fill="currentColor" aria-hidden="true">
            <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" />
          </svg>
        </button>
      </div>

      <div class="space-y-2">
        @if (errorMessage()) {
          <p class="text-center text-sm font-semibold text-[#ec003f]" role="alert">{{ errorMessage() }}</p>
        }

        <app-button type="submit" [isLoading]="isLoading()">Login</app-button>

        <p class="text-center text-base text-white">
          Dont Have An Account Yet ?
          <a
            routerLink="/auth/register"
            class="font-bold text-[#FF4100] underline underline-offset-2 hover:opacity-90"
          >
            Register
          </a>
        </p>
      </div>
    </form>
  </section>
</section>
